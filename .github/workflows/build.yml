name: Build
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Verify reproducible generation
        run: |
          python3 Tools/generate_catalog.py
          git diff --exit-code -- Sources
          test -z "$(git ls-files --others --exclude-standard Sources)"
      - name: Build debug
        run: swift build
      - name: Build release
        run: swift build -c release
